[package]
name = "gemm"
version = "0.1.0"
edition = "2024"
default-run = "gemm"

# GPU crates are built independently by `cargo oxide`, outside the CPU
# workspace.
[workspace]

[features]
# The cuBLASLt denominator `src/bin/bench.rs` divides by. Off by default, and it
# is the *link step* rather than the code that makes that necessary: turning it
# on makes the binary need `libcublasLt.so`, and `gpu/model` path-depends on
# this crate for a symbol it never calls. `modal_app.py --features cublas` is
# what turns it on.
cublas = []

[dependencies]
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "20a56163f258e09f2c51e4c27ae4e4ff17582443" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "20a56163f258e09f2c51e4c27ae4e4ff17582443" }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "20a56163f258e09f2c51e4c27ae4e4ff17582443" }
bench-util = { path = "../bench-util" }
kittens = { package = "ferro-kittens", git = "https://github.com/feitreim/ferro-kittens", rev = "f64a27b43e9200be401901f38bb1db7ec6b8d984" }
half = "2.4"

[profile.release]
debug = false
lto = true
