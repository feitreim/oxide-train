[package]
name = "model"
version = "0.1.0"
edition = "2024"
default-run = "model"
# Every executable includes `src/lib.rs` directly so cuda-oxide collects its
# kernels from the selected binary target. Do not also compile the same source
# as an inferred library target, which defines every device symbol twice.
autolib = false

[workspace]

[dependencies]
bench-util = { path = "../bench-util" }
# `src/lib.rs` includes flash-attn's host.rs by #[path]; its TMA maps and
# ptxas budget gate live in kittens/bench-util.
kittens = { path = "../kittens", features = ["host"] }
cuda-bindings = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "b099f64c1a32869b74be99f4f88242fb68655b51" }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "b099f64c1a32869b74be99f4f88242fb68655b51" }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "b099f64c1a32869b74be99f4f88242fb68655b51" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "b099f64c1a32869b74be99f4f88242fb68655b51" }
tensor-core = { path = "../../crates/tensor-core" }
tensor-cpu = { path = "../../crates/tensor-cpu" }
nn = { path = "../../crates/nn" }
optim = { path = "../../crates/optim" }
data = { path = "../../crates/data", default-features = false }

[profile.release]
debug = false
lto = true
